name: Backend deploy to STACKIT Kubernetes Engine

on:
  # Every merge to staging deploys. Prod (main) is started by hand (Actions → Run workflow).
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy. 'auto' derives it from the branch (main -> prod, staging -> staging)."
        type: choice
        options: [auto, sandbox]
        default: auto

permissions:
  contents: read

# On the whole workflow, so an older commit can't finish building later and deploy last.
concurrency:
  group: backend-deploy-ske-${{ github.ref }}-${{ github.event.inputs.target || 'auto' }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/baergpt-backend
  KUBECTL_VERSION: v1.36.5 # within ±1 minor of the cluster version (kubectl skew policy)

jobs:
  # deploy uses this build's digest, never a tag: PR builds can push tags too.
  build:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to commit sha to avoid sha-hulud like attacks
        with:
          persist-credentials: "false"

      - name: Log in to GitHub Container Registry 🔑
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2, pinned to commit sha to avoid sha-hulud like attacks
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx ⚙️
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0, pinned to commit sha to avoid sha-hulud like attacks

      # No layer cache: any job running on staging/main can write to the Actions cache.
      # The commit-<sha> tag is only for people; deploy uses the digest.
      - name: Build and push image 🐳
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0, pinned to commit sha to avoid sha-hulud like attacks
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: ${{ env.IMAGE_NAME }}:commit-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Manual runs can pick any branch or tag; only the staging and main branches deploy.
    # Compares the full ref: a tag named "main" would have the same ref_name as the branch.
    if: ${{ github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' }}
    # Sandbox has no GitHub environment of its own and uses Staging's.
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'sandbox') && 'Staging' || (github.ref == 'refs/heads/main' && 'Production' || 'Staging') }}

    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to commit sha to avoid sha-hulud like attacks
        with:
          persist-credentials: "false"

      # Re-running an old run would put an old commit live again; roll back with a revert instead.
      - name: Refuse an outdated commit ⛔
        run: |
          set -euo pipefail
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_REF" | cut -f1)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::error::$GITHUB_SHA is no longer the head of $GITHUB_REF ($head). Deploy the newer commit, or revert to roll back."
            exit 1
          fi

      - name: Install 1Password CLI 🔐
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0, pinned to commit sha to avoid sha-hulud like attacks
        with:
          version: 2.39.0 # the action installs "latest" otherwise

      - name: Resolve deployment target 🎯
        id: target
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.target }}" == "sandbox" ]]; then
            namespace="sandbox"
            app_item_id="${{ secrets.OP_BACKEND_SANDBOX_ENV_ITEM_ID }}"
            deploy_item_id="${{ secrets.OP_SKE_DEPLOY_SANDBOX_ITEM_ID }}"
            if [[ -z "$app_item_id" || -z "$deploy_item_id" ]]; then
              echo "::error::OP_BACKEND_SANDBOX_ENV_ITEM_ID and OP_SKE_DEPLOY_SANDBOX_ITEM_ID must both be set. Create the sandbox 1Password items (backend env with GOTENBERG_URL pointing at http://gotenberg.staging.svc.cluster.local:3000, and the sandbox kubeconfig) before deploying sandbox."
              exit 1
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            namespace="prod"
            app_item_id="${{ secrets.OP_BACKEND_PRODUCTION_ENV_ITEM_ID }}"
            deploy_item_id="${{ secrets.OP_SKE_DEPLOY_ITEM_ID }}"
          else
            namespace="staging"
            app_item_id="${{ secrets.OP_BACKEND_STAGING_ENV_ITEM_ID }}"
            deploy_item_id="${{ secrets.OP_SKE_DEPLOY_ITEM_ID }}"
          fi
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "overlay=infra/k8s/overlays/$namespace" >> "$GITHUB_OUTPUT"
          echo "app_item_id=$app_item_id" >> "$GITHUB_OUTPUT"
          echo "deploy_item_id=$deploy_item_id" >> "$GITHUB_OUTPUT"
          echo "Deploying to namespace: $namespace"

      - name: Install kubectl ⚙️
        run: |
          set -euo pipefail
          # Pinned, so a runner image update can't change how overlays render.
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          rm -f kubectl kubectl.sha256

      # Token of the namespace's deployer service account, not cluster admin.
      - name: Fetch kubeconfig 🔐
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          op read "op://${{ secrets.OP_VAULT_ID }}/${{ steps.target.outputs.deploy_item_id }}/kubeconfig" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Check image digest 🔍
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The build job returned no valid image digest (got '$DIGEST')."
            exit 1
          fi
          echo "Deploying ${IMAGE_NAME}@${DIGEST}"

      # Rebuilt from the 1Password note on every deploy, so removed keys disappear too.
      # CF_* and GOTENBERG_MEMORY are Cloud Foundry sizing keys in the same note.
      - name: Sync env Secrets 🔄
        id: secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          set -euo pipefail
          # Outside the workspace, and removed even when a command below fails.
          dir="$RUNNER_TEMP/env"
          mkdir -p -m 700 "$dir"
          trap 'rm -rf "$dir"' EXIT
          op read "op://${{ secrets.OP_VAULT_ID }}/${{ steps.target.outputs.app_item_id }}/notesPlain" > "$dir/all.env"
          : > "$dir/backend.env"
          : > "$dir/gotenberg.env"
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}" # tolerate a CRLF-edited 1Password note
            [[ -z "$line" || "$line" == \#* ]] && continue
            key="${line%%=*}"
            value="${line#*=}"
            echo "::add-mask::$value"
            case "$key" in
              CF_*|GOTENBERG_MEMORY) continue ;;
            esac
            echo "$key=$value" >> "$dir/backend.env"
            # The gotenberg container only reads its basic-auth credentials.
            if [[ "$key" == GOTENBERG_API_BASIC_AUTH_* ]]; then
              echo "$key=$value" >> "$dir/gotenberg.env"
            fi
          done < "$dir/all.env"

          kubectl create secret generic backend-env \
            --namespace "$NAMESPACE" \
            --from-env-file="$dir/backend.env" \
            --save-config --dry-run=client -o yaml | kubectl apply -f -

          # Sandbox uses staging's Gotenberg.
          if [[ "$NAMESPACE" != "sandbox" ]]; then
            kubectl create secret generic gotenberg-env \
              --namespace "$NAMESPACE" \
              --from-env-file="$dir/gotenberg.env" \
              --save-config --dry-run=client -o yaml | kubectl apply -f -
          fi

          # Pods read env only at start; this hash in the pod template rolls them on a Secret change.
          checksum=$(cat "$dir/backend.env" "$dir/gotenberg.env" | sha256sum | cut -d' ' -f1)
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      # kubectl's built-in Kustomize has no `edit`, so digest and checksum are appended.
      - name: Render and apply manifests 🚀
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
          OVERLAY: ${{ steps.target.outputs.overlay }}
        run: |
          set -euo pipefail
          cat >> "$OVERLAY/kustomization.yaml" <<EOF

          images:
            - name: ${{ env.IMAGE_NAME }}
              digest: ${{ needs.build.outputs.digest }}

          commonAnnotations:
            checksum/env: "${{ steps.secrets.outputs.checksum }}"
          EOF

          kubectl kustomize "$OVERLAY" > rendered.yaml

          # The Deployments this overlay applied, in the form `rollout status` takes.
          kubectl apply -f rendered.yaml -o name | tee applied.txt
          grep '^deployment' applied.txt > deployments.txt || true
          if [[ ! -s deployments.txt ]]; then
            echo "::error::No Deployments found in the applied manifests — refusing to continue."
            exit 1
          fi

      # If the new pods never get ready, the previous ReplicaSet keeps serving.
      - name: Wait for rollout ⏳
        id: rollout
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          set -euo pipefail
          while IFS= read -r deployment || [ -n "$deployment" ]; do
            [[ -z "$deployment" ]] && continue
            # Already in resource/name form.
            echo "Waiting for $deployment…"
            kubectl rollout status "$deployment" \
              --namespace "$NAMESPACE" --timeout=5m
          done < deployments.txt

      - name: Smoke check /health 🩺
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          set -euo pipefail
          host=$(kubectl get httproute backend --namespace "$NAMESPACE" -o jsonpath='{.spec.hostnames[0]}')
          echo "Checking https://$host/health"
          timeout=120
          counter=0
          # No --insecure: an invalid certificate fails the deploy (status 000).
          until [ "$(curl -sS -o /dev/null -w '%{http_code}' "https://$host/health")" = "200" ]; do
            if [ $counter -ge $timeout ]; then
              echo "::error::https://$host/health did not return 200 within ${timeout}s (status 000 with a certificate error above means TLS, not the app)."
              exit 1
            fi
            sleep 5
            counter=$((counter + 5))
          done
          echo "Health check passed."

      # Not after a failed smoke check: that's usually DNS or a certificate not ready yet.
      - name: Roll back on failed rollout ↩️
        if: ${{ failure() && !cancelled() && steps.rollout.outcome == 'failure' }}
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          set -uo pipefail
          while IFS= read -r deployment || [ -n "$deployment" ]; do
            [[ -z "$deployment" ]] && continue
            echo "Rolling back $deployment"
            kubectl rollout undo "$deployment" --namespace "$NAMESPACE" || true
          done < deployments.txt

      - name: Dump diagnostics on failure 🪵
        if: ${{ failure() && !cancelled() }}
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          set -uo pipefail
          kubectl get pods --namespace "$NAMESPACE" -o wide || true
          kubectl get events --namespace "$NAMESPACE" --sort-by=.lastTimestamp | tail -50 || true
          # No `kubectl logs`: app logs carry user data, and this repo's Actions logs are public.
          echo "Backend logs: STACKIT Logs / Grafana Explore, {service_name=\"ske-$NAMESPACE\"}"
