name: prettier-eslint.yml
on:
  pull_request:
    branches: [main, staging]

jobs:
  prettier-eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to commit sha to avoid sha-hulud like attacks

      - name: Setup environment ⚙️
        uses: ./.github/actions/setup

      - name: Check Prettier 🧹
        run: npm run prettier:check

      - name: Check ESLint 🔎
        run: npm run lint:check
