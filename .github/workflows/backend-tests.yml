name: Backend Tests

on:
  pull_request:
    branches: [main, staging]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to commit sha to avoid sha-hulud like attacks

      - name: Setup environment ⚙️
        uses: ./.github/actions/setup
        with:
          start-supabase: "true"
          install-1password: "true"

      - name: Fetch backend .env from 1Password ⬇️
        working-directory: apps/backend
        run: |
          echo "Fetching backend .env from 1Password..."
          op read "op://${{ secrets.OP_VAULT_ID }}/${{ secrets.OP_BACKEND_TEST_ENV_ITEM_ID }}/notesPlain" > .env
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Wait for Supabase to be ready ⏳
        uses: ./.github/actions/wait-for-supabase

      # `supabase db diff` writes its progress to stderr and exits 0 either way, so the
      # drift signal is stdout alone: empty when the schemas match, the missing SQL otherwise.
      - name: Check for schema drift 🔍
        working-directory: apps/backend
        run: |
          DRIFT="$(supabase db diff --schema public)"

          if [ -z "$DRIFT" ]; then
            echo "No drift: supabase/schemas matches the applied migrations."
            exit 0
          fi

          echo "Schema drift detected — supabase/schemas and supabase/migrations disagree."
          echo "This is the SQL that would turn the migrations state into the schemas state:"
          echo "--------------------------------------------------------------------------------"
          echo "$DRIFT"
          echo "--------------------------------------------------------------------------------"
          echo "If you edited supabase/schemas: run 'npm run db:generate-migration <MIGRATION_NAME>'"
          echo "in apps/backend and commit the generated migration."
          echo "If you hand-wrote a migration: mirror the change in the matching supabase/schemas file."
          exit 1

      - name: Run Database Linting 🔍
        working-directory: apps/backend
        run: |
          npm run lint:db

      - name: Upload default document 📄
        working-directory: apps/backend
        run: |
          npm run db:upload-default-documents

      - name: Run integration tests 🧪
        working-directory: apps/backend
        run: |
          npm test
