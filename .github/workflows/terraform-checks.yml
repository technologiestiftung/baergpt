name: Terraform Checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".tool-versions"
      - ".github/workflows/terraform-checks.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".tool-versions"
      - ".github/workflows/terraform-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

