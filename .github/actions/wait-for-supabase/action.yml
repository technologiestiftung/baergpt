name: Wait for Supabase to be ready
description: Polls until the Supabase REST API and PostgreSQL are both accepting connections

runs:
  using: composite
  steps:
    - name: Wait for Supabase to be ready ⏳
      shell: bash
      run: |
        timeout=600
        counter=0

        ANON_KEY="${SUPABASE_ANON_KEY:-}"
        if [ -z "$ANON_KEY" ]; then
          ANON_KEY=$(grep -h '^SUPABASE_ANON_KEY=' apps/backend/.env "$RUNNER_TEMP/backend.env" 2>/dev/null | cut -d'=' -f2- | tr -d '"' | tr -d "'" | head -n1 || true)
        fi

        HEADER_ARG=()
        if [ -n "$ANON_KEY" ]; then
          HEADER_ARG=(-H "apikey: $ANON_KEY")
        fi

        # Sometimes the postgrest api and postgres are up, but individual postgrest endpoints are not ready yet.
        # Therefore we check if a table (e.g. `application_admins`) is available in the postgrest api.

        until curl -sf "${HEADER_ARG[@]}" http://localhost:54321/rest/v1/application_admins >/dev/null && pg_isready -U postgres -h localhost -p 54322; do
          if [ $counter -gt $timeout ]; then
            echo "Timed out waiting for Supabase"
            if command -v docker >/dev/null 2>&1; then
              echo "=== Docker status ==="
              docker ps
            fi
            exit 1
          fi
          echo "Waiting for Supabase to be ready..."
          sleep 1
          counter=$((counter + 1))
        done
        echo "Supabase is ready!"
