name: Setup Node.js environment
description: Installs tools via asdf, Node.js, upgrades npm, caches and installs npm dependencies, and optionally installs 1Password CLI

inputs:
  install-asdf-tools:
    description: Install tools defined in .tool-versions via asdf (e.g. supabase CLI)
    default: 'false'
  start-supabase:
    description: Start local Supabase in the background immediately after asdf install
    default: 'false'
  install-1password:
    description: Install 1Password CLI
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install tools via asdf ⚙️
      if: inputs.install-asdf-tools == 'true'
      uses: asdf-vm/actions/install@v4

    # Start supabase right after asdf so it boots in the background during Node setup and npm install.
    - name: Start supabase ⚡️
      if: inputs.start-supabase == 'true'
      shell: bash
      run: cd apps/backend && supabase start --exclude studio,realtime,imgproxy,edge-runtime,logflare,supavisor,postgres-meta &

    - name: Setup Node.js using .nvmrc ⚙️
      uses: actions/setup-node@v5
      with:
        node-version-file: ".nvmrc"

    - name: Upgrade npm 🔧
      shell: bash
      run: npm install -g npm@11.x

    - name: Cache npm dependencies 💾
      id: cache-npm-deps
      uses: actions/cache@v4
      with:
        path: |
          **/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Install dependencies 📦
      if: steps.cache-npm-deps.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Install 1Password CLI 🔐
      if: inputs.install-1password == 'true'
      uses: 1password/install-cli-action@v2
