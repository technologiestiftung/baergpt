# No Gotenberg: sandbox uses staging's, so its GOTENBERG_URL in 1Password is
# http://gotenberg.staging.svc.cluster.local:3000.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sandbox

resources:
  - ../../base/backend

patches:
  - path: httproute-host-patch.yaml
    target:
      kind: HTTPRoute
      name: backend
