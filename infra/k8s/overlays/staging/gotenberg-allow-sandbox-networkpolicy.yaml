# Sandbox has no gotenberg of its own — it reuses staging's. Opens the one
# cross-namespace path the base gotenberg NetworkPolicy (same-namespace-only) doesn't allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gotenberg-allow-sandbox
spec:
  podSelector:
    matchLabels:
      app: gotenberg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox
      ports:
        - port: http
