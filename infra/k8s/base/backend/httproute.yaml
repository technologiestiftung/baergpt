# Attaches to the shared Gateway in infra/terraform/ske/platform.tf, which owns listeners and TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
spec:
  parentRefs:
    - name: baergpt
      namespace: gateway
      kind: Gateway
      # Each listener accepts routes only from its own namespace.
      sectionName: https-PLACEHOLDER
  hostnames:
    - PLACEHOLDER.baergpt-ske.stackit.rocks # overridden per-env
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 3000
      # Envoy's default ends any response after 15s, which cuts off streamed chats.
      timeouts:
        request: 600s
