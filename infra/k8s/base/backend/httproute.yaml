# Replaces the Ingress resource: Gateway API is the upstream successor, and the
# ingress-nginx controller that would have served an Ingress was retired in March 2026.
#
# The Gateway itself (listeners, TLS, certificates) is platform-owned and lives in
# Terraform — infra/terraform/ske/platform.tf. This only attaches a route to it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
spec:
  parentRefs:
    - name: baergpt
      namespace: gateway
      kind: Gateway
      # Pins the route to this environment's own TLS listener. The Gateway only allows
      # each listener to be claimed from its matching namespace, so sandbox cannot
      # attach itself to the prod hostname.
      sectionName: https-PLACEHOLDER
  hostnames:
    - PLACEHOLDER.baergpt-ske.stackit.rocks # overridden per-env
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 3000
