apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1 # overridden per-env
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the current replica count mid-rollout — same guarantee as CF's `--strategy rolling`
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false # never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # numeric: the image's USER is a name, which runAsNonRoot can't verify
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Replaced at deploy time with the digest of the image the deploy workflow builds.
          image: ghcr.io/technologiestiftung/baergpt-backend:placeholder
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # Created by the deploy workflow from the env's 1Password notesPlain blob.
            - secretRef:
                name: backend-env
          env:
            - name: PORT # overrides any PORT in backend-env, which would move the app off containerPort
              value: "3000"
            # Keeps the JS heap below the 4Gi limit so a heap leak ends in "heap out of memory" with a
            # stack trace. Buffers (e.g. a large upload body) live outside the heap and can still hit the
            # limit, which kills the container silently (OOMKilled).
            - name: NODE_OPTIONS
              value: --max-old-space-size=3072
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 1Gi # prod sets request = limit, see overlays/prod
            limits:
              memory: 4Gi
          # CF: health-check-invocation-timeout 10s, timeout (start) 180s.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 18 # 18 * 10s = 180s, matches CF's app-start timeout
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # gives the LB time to deregister this pod's endpoint before SIGTERM is
              # sent — needed until the graceful-shutdown code task (index.ts) lands.
              # exec+sleep instead of the native `sleep` action for compatibility with
              # whatever k8s version SKE ends up on (native sleep needs 1.29+).
              exec:
                command: ["sleep", "5"]
      volumes:
        # The only writable path, for libraries that expect a temp dir (the app itself writes no files);
        # emptied whenever the pod is replaced.
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
