# Caps voluntary disruptions (node drains, cluster upgrades) at one backend pod at a
# time.
#
# maxUnavailable rather than minAvailable on purpose: with `minAvailable: 1` and a
# single replica (staging/sandbox), evicting the only pod would take availability to
# zero, so the eviction API refuses it outright and `kubectl drain` — including SKE's
# automated node rollouts during maintenance — hangs forever.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
