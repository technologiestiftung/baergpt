apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
spec:
  replicas: 1 # overridden per-env
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # numeric: the image's USER is a name, which runAsNonRoot can't verify
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gotenberg
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gotenberg
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: gotenberg
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Same upstream image + basic-auth flag as infra/gotenberg/manifest.yml today —
          # public Docker Hub image, no imagePullSecret needed.
          image: gotenberg/gotenberg:8.34.0@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923
          args: ["gotenberg", "--api-enable-basic-auth"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: gotenberg-env # GOTENBERG_API_BASIC_AUTH_USERNAME/PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 1Gi # prod sets request = limit, see overlays/prod
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 18 # 180s, matches CF's app-start timeout
