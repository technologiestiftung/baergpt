apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
spec:
  replicas: 1 # overridden per-env
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      automountServiceAccountToken: false # never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # numeric: the image's USER is a name, which runAsNonRoot can't verify
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gotenberg
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gotenberg
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: gotenberg
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Public Docker Hub image, no imagePullSecret needed. 8.37.0+: older LibreOffice has
          # memory bugs in the DOCX import, and every uploaded .docx goes through it.
          image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
          # The backend only calls /forms/libreoffice/convert, so the Chromium (HTML/URL) routes stay off.
          args: ["gotenberg", "--api-enable-basic-auth", "--chromium-disable-routes"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: gotenberg-env # GOTENBERG_API_BASIC_AUTH_USERNAME/PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi # prod sets request = limit, see overlays/prod
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 18 # 180s, matches CF's app-start timeout
      volumes:
        # The only writable path (LibreOffice's profile and conversion files); emptied whenever the pod is replaced.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
