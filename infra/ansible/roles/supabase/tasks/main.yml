- name: Read the deployed stack release
  ansible.builtin.slurp:
    src: "{{ supabase_release_file }}"
  register: supabase_deployed_release
  failed_when: false
  tags: [email-templates]

- name: Check for an existing database
  ansible.builtin.stat:
    path: "{{ supabase_dir }}/volumes/db/data/PG_VERSION"
  register: supabase_existing_db
  tags: [email-templates]

# This compose file on an older stack would start Postgres 17 on Postgres 15 data, and the new
# Auth and Storage would migrate the schema without a rollback point.
- name: Refuse to deploy onto a host that needs supabase-upgrade.yml first
  ansible.builtin.assert:
    that: >-
      (supabase_upgrading | bool) or not supabase_existing_db.stat.exists or
      (supabase_deployed_release.content | default('') | b64decode | trim) == supabase_release
    fail_msg: "{{ inventory_hostname }} is not on {{ supabase_release }} yet. Run supabase-upgrade.yml."
    quiet: true
  tags: [email-templates]

- name: Check whether the Supabase stack is already provisioned
  ansible.builtin.stat:
    path: "{{ supabase_dir }}/docker-compose.yml"
  register: supabase_compose

# Only needed on first provision: the copy task below is guarded by `creates:`,
# so re-cloning would add an anonymous GitHub fetch that can hang the play.
- name: Clone Supabase repo (shallow)
  ansible.builtin.git:
    repo: "{{ supabase_repo }}"
    dest: "{{ supabase_src }}"
    version: "{{ supabase_ref }}"
    depth: 1
    force: true
  when: not supabase_compose.stat.exists
  environment:
    GIT_TERMINAL_PROMPT: "0"

- name: Ensure Supabase target dir exists
  ansible.builtin.file:
    path: "{{ supabase_dir }}"
    state: directory
    mode: "0755"

- name: Copy docker folder to target
  ansible.builtin.command:
    cmd: "cp -r {{ supabase_src }}/docker/. {{ supabase_dir }}/"
  args:
    creates: "{{ supabase_dir }}/docker-compose.yml"

- name: Overwrite docker-compose.yml with project version
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../supabase/docker-compose.yml"
    dest: "{{ supabase_dir }}/docker-compose.yml"
    mode: "0644"
    force: true

# Unchanged upstream files from self-hosted/v0.8.2 (see infra/README.md).
- name: Upload Envoy config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../supabase/volumes/api/envoy/"
    dest: "{{ supabase_dir }}/volumes/api/envoy/"
    mode: "0644"
    directory_mode: "0755"
  notify: Recreate api-gw

- name: Upload Vector config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../supabase/volumes/logs/vector.yml"
    dest: "{{ supabase_dir }}/volumes/logs/vector.yml"
    mode: "0644"
  notify: Recreate vector

- name: Upload pooler config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../supabase/volumes/pooler/pooler.exs"
    dest: "{{ supabase_dir }}/volumes/pooler/pooler.exs"
    mode: "0644"
  notify: Recreate supavisor

# Only runs when Postgres initialises an empty data directory.
- name: Upload database init settings
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../supabase/volumes/db/jwt.sql"
    dest: "{{ supabase_dir }}/volumes/db/jwt.sql"
    mode: "0644"

# email-template-sync keeps the templates in step with email_templates_branch (see infra/README.md).
# Only these tasks: supabase.yml --tags email-templates.
- name: Create the email template sync user
  ansible.builtin.user:
    name: "{{ email_templates_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  tags: [email-templates]

- name: Ensure email template dir exists
  ansible.builtin.file:
    path: "{{ supabase_dir }}/volumes/email-templates"
    state: directory
    owner: "{{ email_templates_user }}"
    group: "{{ email_templates_user }}"
    mode: "0755"
  # Check mode doesn't create the user above, so the owner lookup fails on hosts that don't have it yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [email-templates]

- name: Install email template sync script
  ansible.builtin.copy:
    src: email_template_sync.py
    dest: /usr/local/sbin/email-template-sync
    mode: "0755"
  tags: [email-templates]

- name: Install email template sync service
  ansible.builtin.template:
    src: email-template-sync.service.j2
    dest: /etc/systemd/system/email-template-sync.service
    mode: "0644"
  register: email_templates_service
  tags: [email-templates]

- name: Install email template sync timer
  ansible.builtin.copy:
    src: email-template-sync.timer
    dest: /etc/systemd/system/email-template-sync.timer
    mode: "0644"
  register: email_templates_timer
  tags: [email-templates]

- name: Enable email template sync timer
  ansible.builtin.systemd:
    name: email-template-sync.timer
    daemon_reload: "{{ email_templates_service.changed or email_templates_timer.changed }}"
    enabled: true
    state: started
  when: not ansible_check_mode
  tags: [email-templates]

# A failed sync keeps the previous templates, so it only blocks the play on a host that has none yet.
- name: Sync email templates now
  ansible.builtin.command:
    cmd: systemctl start email-template-sync.service
  register: email_templates_sync
  failed_when: false
  changed_when: false
  when: not ansible_check_mode
  tags: [email-templates]

- name: Warn when the email template sync failed
  ansible.builtin.debug:
    msg: "email-template-sync failed; the previous templates stay. See: journalctl -u email-template-sync"
  when: email_templates_sync.rc | default(0) != 0
  tags: [email-templates]

- name: Check the email templates are in place
  ansible.builtin.stat:
    path: "{{ supabase_dir }}/volumes/email-templates/{{ item }}.html"
  loop: "{{ supabase_email_templates }}"
  register: email_templates_files
  tags: [email-templates]

- name: Require the email templates
  ansible.builtin.assert:
    that: email_templates_files.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: "Email templates are missing. See: journalctl -u email-template-sync"
    quiet: true
  when: not ansible_check_mode
  tags: [email-templates]

- name: Upload email template server config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../supabase/email-templates.conf"
    dest: "{{ supabase_dir }}/email-templates.conf"
    mode: "0644"
  notify: Recreate email-templates
  tags: [email-templates]

- name: Ensure Studio snippets dir exists
  ansible.builtin.file:
    path: "{{ supabase_dir }}/volumes/snippets"
    state: directory
    mode: "0755"

- block:
    - name: Render .env from 1Password (local)
      ansible.builtin.command:
        cmd: "op read 'op://{{ lookup('env', 'ENV_FILE_REF') }}' --out-file {{ playbook_dir }}/../supabase/.env --force"
      delegate_to: localhost
      run_once: true
      become: false
      no_log: true
      check_mode: false

    - name: Upload resolved .env
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../supabase/.env"
        dest: "{{ supabase_dir }}/.env"
        mode: "0640"
      no_log: true

  when: supabase_env_from_1password | bool
  always:
    - name: Delete local .env after upload
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../supabase/.env"
        state: absent
      delegate_to: localhost
      become: false

# The .env is rendered fresh from 1Password on every run, so these GoTrue
# hardening overrides are (re)applied here to guarantee they are present.
# these lines make the intended values explicit and tunable without a
# code change.
- name: Ensure GoTrue OTP hardening vars in .env
  ansible.builtin.lineinfile:
    path: "{{ supabase_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - { key: "GOTRUE_MAILER_OTP_EXP", value: "1800" } # 30 min instead of 24h
    - { key: "GOTRUE_MAILER_OTP_LENGTH", value: "10" } # numeric-only OTP; length is the entropy lever
    - { key: "GOTRUE_RATE_LIMIT_VERIFY", value: "5" } # low; only meaningful once RATE_LIMIT_HEADER is set
  loop_control:
    label: "{{ item.key }}"

- name: Require https for STACKIT observability URLs in .env
  ansible.builtin.command:
    cmd: >-
      grep -qE "^{{ item }}=[\"']?https://" .env
  args:
    chdir: "{{ supabase_dir }}"
  loop:
    - STACKIT_OBSERVABILITY_METRICS_PUSH_URL
    - STACKIT_OBSERVABILITY_LOGS_OTLP_URL
    - STACKIT_OBSERVABILITY_LOGS_LOKI_URL
  changed_when: false
  check_mode: false

- name: Upload otel-collector config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../supabase/otel-config.yml"
    dest: "{{ supabase_dir }}/otel-config.yml"
    mode: "0644"
    force: true
  notify: Recreate otel-collector

- name: Upload monitoring compose overlay
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../supabase/docker-compose.monitoring.yml"
    dest: "{{ supabase_dir }}/docker-compose.monitoring.yml"
    mode: "0644"
    force: true
  notify:
    - Recreate otel-collector
    - Recreate vector

- name: Upload Vector STACKIT sink config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../supabase/vector-stackit.yml"
    dest: "{{ supabase_dir }}/vector-stackit.yml"
    mode: "0644"
    force: true
  notify: Recreate vector

- name: Render monitoring.env from inventory
  ansible.builtin.template:
    src: monitoring.env.j2
    dest: "{{ supabase_dir }}/monitoring.env"
    mode: "0640"
  notify:
    - Recreate otel-collector
    - Recreate vector

- name: Pull images
  ansible.builtin.command:
    cmd: "{{ supabase_compose_cmd }} pull"
  args:
    chdir: "{{ supabase_dir }}"

# The postgres user's uid differs between Postgres images, and Postgres refuses a TLS key owned by anyone else but root.
- name: Look up the postgres user of the Postgres image
  ansible.builtin.command:
    cmd: "docker run --rm --entrypoint sh {{ supabase_postgres_image }} -c 'id -u postgres; id -g postgres'"
  register: supabase_postgres_ids
  changed_when: false
  check_mode: false

- name: Give the Postgres TLS cert to that user
  ansible.builtin.file:
    path: "{{ supabase_dir }}/volumes/db/certs/{{ item.name }}"
    state: file
    owner: "{{ supabase_postgres_ids.stdout_lines[0] }}"
    group: "{{ supabase_postgres_ids.stdout_lines[1] }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: server.key, mode: "0600" }
    - { name: server.crt, mode: "0644" }
  loop_control:
    label: "{{ item.name }}"

# A bad Vector config stops the auth logs to STACKIT: fail before recreating anything.
# Health checks off, not --no-environment (which skips compiling remaps), so a STACKIT outage can't block deploys.
- name: Validate Vector config
  ansible.builtin.command:
    cmd: >-
      {{ supabase_compose_cmd }}
      run --rm --no-deps -T --entrypoint sh vector -c
      'printf "healthchecks:\n  enabled: false\n" > /tmp/no-healthchecks.yml
      && vector validate /tmp/no-healthchecks.yml /etc/vector/vector.yml /etc/vector/vector-stackit.yml'
  args:
    chdir: "{{ supabase_dir }}"
  changed_when: false

# --remove-orphans stops containers of services that were removed from the compose file.
- name: Start Supabase + monitoring stack
  ansible.builtin.command:
    cmd: "{{ supabase_compose_cmd }} up -d --remove-orphans"
  args:
    chdir: "{{ supabase_dir }}"

- name: Wait for the database
  ansible.builtin.command:
    cmd: docker exec supabase-db pg_isready -U postgres -h localhost
  register: supabase_db_ready
  until: supabase_db_ready.rc == 0
  retries: 60
  delay: 5
  changed_when: false

# Older init scripts stored the JWT signing secret as a database setting, readable by any database role.
# Nothing reads it. Sessions opened before the reset keep it until they reconnect.
- name: Remove the JWT secret from the database settings
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - supabase-db
      - psql
      - -h
      - localhost
      - -U
      - supabase_admin
      - -d
      - postgres
      - -v
      - ON_ERROR_STOP=1
      - -tA
      - -c
      - >-
        SELECT 'present' FROM pg_db_role_setting s JOIN pg_database d ON d.oid = s.setdatabase, unnest(s.setconfig) c
        WHERE d.datname = 'postgres' AND s.setrole = 0 AND split_part(c, '=', 1) = 'app.settings.jwt_secret'
      - -c
      - ALTER DATABASE postgres RESET "app.settings.jwt_secret"
  register: supabase_jwt_setting
  changed_when: "'present' in supabase_jwt_setting.stdout"

# supabase-upgrade.yml records it itself once its checks pass.
- name: Record the deployed stack release
  ansible.builtin.copy:
    content: "{{ supabase_release }}\n"
    dest: "{{ supabase_release_file }}"
    mode: "0644"
  when: not (supabase_upgrading | bool)
