# force-recreate: the config is a bind-mounted single file, so a plain `up -d`
# keeps the old inode after the file is replaced. Recreating reloads it.
- name: Recreate otel-collector
  ansible.builtin.command:
    cmd: "{{ supabase_compose_cmd }} up -d --force-recreate otel-collector"
  args:
    chdir: "{{ supabase_dir }}"

- name: Recreate vector
  ansible.builtin.command:
    cmd: "{{ supabase_compose_cmd }} up -d --force-recreate vector"
  args:
    chdir: "{{ supabase_dir }}"

