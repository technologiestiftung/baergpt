- name: Create migrations system user
  ansible.builtin.user:
    name: migrations
    system: true
    create_home: true
    shell: /bin/bash

# sudo matches commands by path. The wrappers live outside the migrations home: that user may rename
# anything in its home, which would let it swap in its own script and run it as root.
- name: Create the wrapper directory
  ansible.builtin.file:
    path: "{{ migrations_wrapper_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove the old wrapper directory from the migrations home
  ansible.builtin.file:
    path: /home/migrations/bin
    state: absent

- name: Deploy docker-inspect-db-ip wrapper
  ansible.builtin.template:
    src: docker-inspect-db-ip.j2
    dest: "{{ migrations_wrapper_dir }}/docker-inspect-db-ip"
    owner: root
    group: migrations
    mode: "0750"

# Left over on hosts deployed by earlier versions of this role.
- name: Remove retired wrappers
  ansible.builtin.file:
    path: "{{ migrations_wrapper_dir }}/{{ item }}"
    state: absent
  loop:
    - docker-restart-auth
    - update-email-templates

- name: Configure sudoers for migrations user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/migrations
    content: |
      migrations ALL=(root) NOPASSWD: {{ migrations_wrapper_dir }}/docker-inspect-db-ip
    mode: "0440"
    validate: visudo -cf %s

- name: Configure sshd for migrations user
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED - migrations user"
    block: |
      Match User migrations
          AllowTcpForwarding yes
          PermitTTY no
          X11Forwarding no
          AllowAgentForwarding no
  notify: Reload sshd

- name: Create ~/.ssh directory for migrations user
  ansible.builtin.file:
    path: /home/migrations/.ssh
    state: directory
    owner: migrations
    group: migrations
    mode: "0700"

- name: Install migrations SSH public key
  ansible.builtin.copy:
    dest: /home/migrations/.ssh/authorized_keys
    content: "{{ lookup('env', 'MIGRATIONS_SSH_PUBLIC_KEY') }}\n"
    owner: migrations
    group: migrations
    mode: "0600"
  no_log: true
