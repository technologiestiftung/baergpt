# Identity the backend uses to manage sandbox pods. It can do nothing outside this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-manager
  namespace: baergpt-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: baergpt-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-manager
  namespace: baergpt-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-manager
subjects:
  - kind: ServiceAccount
    name: sandbox-manager
    namespace: baergpt-sandbox
