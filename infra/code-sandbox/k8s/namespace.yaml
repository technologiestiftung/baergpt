apiVersion: v1
kind: Namespace
metadata:
  name: baergpt-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: baergpt-sandbox
spec:
  hard:
    pods: "20"
    limits.cpu: "40"
    limits.memory: 40Gi
